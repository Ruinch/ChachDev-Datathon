[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cash-procedure-audit"
version = "0.1.0"
description = "Local video review API for bank cash procedures"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]
ml = ["av==19.0.1", "openpyxl==3.1.5", "imageio-ffmpeg==0.6.0"]

[tool.setuptools.packages.find]
include = ["app*", "ml_tools*"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
